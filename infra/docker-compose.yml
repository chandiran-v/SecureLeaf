version: "3.9"

# =============================================================================
# SecureLeaf — Local Development Infrastructure
# =============================================================================
# Services:
#   postgres   — Primary database (PostgreSQL 16)
#   redis      — Session locks, signed URL tokens, Pub/Sub (Redis 7)
#   minio      — S3-compatible object store for raw PDFs + image tiles
#   minio-init — One-shot sidecar that creates MinIO buckets on first run
#   mailpit    — Dev SMTP catcher for purchase emails (UI on :8025)
#   pgadmin    — Visual PostgreSQL admin UI (optional, comment out to save RAM)
#   prometheus — (profile "monitoring") scrapes the backend's /actuator/prometheus  :9090
#   grafana    — (profile "monitoring") provisioned viewer dashboard                 :3001
#
# Usage:
#   Start all:        docker compose up -d
#   With monitoring:  docker compose --profile monitoring up -d   (Phase 10; Grafana admin/admin)
#   Stop all:         docker compose down
#   Wipe all data:    docker compose down -v
#   View logs:        docker compose logs -f [service]
#   Restart one:      docker compose restart [service]
# =============================================================================

networks:
  secureleaf-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  pgadmin_data:
  prometheus_data:
  grafana_data:

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL 16
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: secureleaf-postgres
    restart: unless-stopped
    networks:
      - secureleaf-net
    ports:
      - "5432:5432"                         # exposed to host for IDE/DBeaver connection
    environment:
      POSTGRES_DB:       secureleaf
      POSTGRES_USER:     secureleaf_user
      POSTGRES_PASSWORD: secureleaf_pass    # change before any cloud deployment
      PGDATA:            /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Mount your schema SQL here — runs automatically on first container creation
      # Uncomment once db_schema.sql is generated from db_schema.md:
      # - ./infra/sql/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secureleaf_user -d secureleaf"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512m

  # ---------------------------------------------------------------------------
  # Redis 7
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: secureleaf-redis
    restart: unless-stopped
    networks:
      - secureleaf-net
    ports:
      - "6379:6379"                         # exposed to host for Redis CLI / IDE inspection
    command: >
      redis-server
      --requirepass secureleaf_redis_pass
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "secureleaf_redis_pass", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 320m

  # ---------------------------------------------------------------------------
  # MinIO (S3-compatible object store)
  # Two buckets are used:
  #   secureleaf-raw   — raw uploaded PDFs (private, never publicly accessible)
  #   secureleaf-tiles — processed image tiles (private, served via signed URLs)
  # ---------------------------------------------------------------------------
  minio:
    image: quay.io/minio/minio:latest
    container_name: secureleaf-minio
    restart: unless-stopped
    networks:
      - secureleaf-net
    ports:
      - "9000:9000"                         # S3 API — Spring Boot connects here
      - "9001:9001"                         # MinIO Web Console (browser UI)
    environment:
      MINIO_ROOT_USER:     secureleaf_minio_user
      MINIO_ROOT_PASSWORD: secureleaf_minio_pass  # min 8 chars required by MinIO
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512m

  # ---------------------------------------------------------------------------
  # MinIO Init (one-shot sidecar)
  # Creates buckets and sets access policies after MinIO is healthy.
  # Exits with code 0 on success — Docker Compose does not restart it.
  # ---------------------------------------------------------------------------
  minio-init:
    image: quay.io/minio/mc:latest
    container_name: secureleaf-minio-init
    networks:
      - secureleaf-net
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER:     secureleaf_minio_user
      MINIO_ROOT_PASSWORD: secureleaf_minio_pass
    entrypoint: >
      /bin/sh -c "
        echo '==> Waiting for MinIO to be ready...' &&
        until mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do
          echo '    MinIO not ready yet, retrying in 3s...' && sleep 3;
        done &&

        echo '==> Creating bucket: secureleaf-raw (raw PDF uploads)' &&
        mc mb --ignore-existing local/secureleaf-raw &&
        mc anonymous set none local/secureleaf-raw &&

        echo '==> Creating bucket: secureleaf-tiles (processed image tiles)' &&
        mc mb --ignore-existing local/secureleaf-tiles &&
        mc anonymous set none local/secureleaf-tiles &&

        echo '==> All buckets created and set to private. Done.'
      "
    restart: "no"                           # do not restart; this is a one-shot init job

  # ---------------------------------------------------------------------------
  # Mailpit — dev SMTP catcher (Phase 4: purchase / sale emails, PAY-08)
  # The backend sends to localhost:1025; nothing leaves your machine.
  # Read the caught emails at: http://localhost:8025
  # ---------------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:latest
    container_name: secureleaf-mailpit
    restart: unless-stopped
    networks:
      - secureleaf-net
    ports:
      - "1025:1025"                         # SMTP — spring.mail.port in application.yml
      - "8025:8025"                         # Web UI
    deploy:
      resources:
        limits:
          memory: 64m

  # ---------------------------------------------------------------------------
  # pgAdmin 4 (optional — comment out to save ~300MB RAM)
  # Access at: http://localhost:5050
  # Login:     admin@secureleaf.local / admin
  # ---------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: secureleaf-pgadmin
    restart: unless-stopped
    networks:
      - secureleaf-net
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL:    admin@secureleaf.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"   # single-user mode, no login required
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256m

  # ---------------------------------------------------------------------------
  # Phase 10 D3 — monitoring (opt-in: docker compose --profile monitoring up -d)
  # Prometheus scrapes the backend on the host; Grafana shows the provisioned
  # "SecureLeaf — Viewer" dashboard (infra/grafana/dashboards/secureleaf-viewer.json).
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.53.1          # multi-arch (amd64 + arm64)
    container_name: secureleaf-prometheus
    profiles: ["monitoring"]
    restart: unless-stopped
    networks:
      - secureleaf-net
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Linux needs this; Docker Desktop has it built in
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    deploy:
      resources:
        limits:
          memory: 256m

  grafana:
    image: grafana/grafana:11.1.3           # multi-arch (amd64 + arm64)
    container_name: secureleaf-grafana
    profiles: ["monitoring"]
    restart: unless-stopped
    networks:
      - secureleaf-net
    ports:
      - "3001:3000"                         # 3000 is left free for the frontend dev server
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin     # local only; this profile is never used in production
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 256m
