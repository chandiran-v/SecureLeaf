# Render Blueprint — the SecureLeaf backend on Render's FREE web service (512 MB, 0.1 CPU).
# Frontend: Vercel. Postgres: Neon. Redis: Upstash. Files: Backblaze B2. Mail: Brevo API.
# Guide: docs/deployment-render.md. Every JVM/app limit here was measured under the same limits:
# docs/learning-notes/perf-01-purchase-time-watermarking.md.
#
# Secrets are `sync: false`: Render asks for them in its dashboard, they are never in this file.
services:
  - type: web
    name: secureleaf-backend
    runtime: docker
    plan: free
    region: singapore                      # nearest Render region to India; put Neon/Upstash there too
    dockerContext: ./backend
    dockerfilePath: ./infra/docker/backend.Dockerfile
    # Liveness, NOT readiness: readiness includes Postgres and Redis, and a failing health check makes
    # Render restart the service — a ~14-minute outage on 0.1 CPU — for what is usually a short blip.
    healthCheckPath: /actuator/health/liveness
    autoDeploy: false                      # every deploy is a ~14-minute startup: deploy deliberately
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod,render
      # Measured: the image default (MaxRAMPercentage=70, G1, full JIT) was OOM-killed at 512 MB and
      # took 25 min to start; these flags survive uploads + 5 readers and start in ~14 min.
      - key: JAVA_OPTS
        value: >-
          -XX:TieredStopAtLevel=1 -XX:+UseSerialGC -Xms64m -Xmx256m
          -XX:MaxMetaspaceSize=180m -XX:ReservedCodeCacheSize=48m -Xss512k
          -XX:+ExitOnOutOfMemoryError -Djava.awt.headless=true

      # ── Generated by Render (random, never shown in git) ──
      - key: JWT_SECRET
        generateValue: true
      - key: DRM_SIGNING_SECRET
        generateValue: true

      # ── Neon Postgres ──
      - key: DB_HOST
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false

      # ── Upstash Redis (TLS) ──
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        value: "6379"
      - key: REDIS_PASSWORD
        sync: false

      # ── Backblaze B2 (S3-compatible) — bucket names are global on B2: pick your own ──
      - key: MINIO_ENDPOINT
        sync: false                        # e.g. https://s3.us-west-004.backblazeb2.com
      - key: MINIO_REGION
        sync: false                        # e.g. us-west-004 (the part after "s3." in the endpoint)
      - key: MINIO_ACCESS_KEY
        sync: false                        # B2 keyID
      - key: MINIO_SECRET_KEY
        sync: false                        # B2 applicationKey
      - key: MINIO_BUCKET_RAWUPLOADS
        sync: false
      - key: MINIO_BUCKET_TILES
        sync: false
      - key: MINIO_BUCKET_THUMBNAILS
        sync: false

      # ── Mail (Brevo HTTPS API; SMTP is blocked on Render free) ──
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false                        # must be a sender verified in Brevo

      # ── Razorpay TEST mode (prod refuses mock and blank keys) ──
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

      # ── The Vercel frontend ──
      - key: FRONTEND_BASE_URL
        sync: false                        # e.g. https://secureleaf.vercel.app (emailed links)
      - key: CORS_ALLOWED_ORIGINS
        sync: false                        # the same origin, so the browser may call this API
      - key: ADMIN_EMAILS
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
