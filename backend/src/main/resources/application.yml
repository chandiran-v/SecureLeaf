spring:
  application:
    name: secureleaf-backend


  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:secureleaf}
    username: ${DB_USER:secureleaf_user}
    password: ${DB_PASSWORD:secureleaf_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate          # Flyway manages schema; Hibernate validates only
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # ── Flyway migrations ────────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration

  # ── Redis ─────────────────────────────────────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:secureleaf_redis_pass}

  # ── GraphQL ───────────────────────────────────────────────────────────────
  graphql:
    graphiql:
      enabled: true              # Disabled in production profile
    schema:
      locations: classpath:graphql/
      file-extensions: .graphqls

  # ── File Upload limits ───────────────────────────────────────────────────
  servlet:
    multipart:
      max-file-size: 55MB
      max-request-size: 60MB

  # ── Mail ──────────────────────────────────────────────────────────────────
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USER:}
    password: ${MAIL_PASS:}

# ── App-wide (D10) ────────────────────────────────────────────────────────────
app:
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}   # used to build emailed links (e.g. password reset)

# ── Admin bootstrap (Phase 8, D1) ─────────────────────────────────────────────
# Comma-separated list of emails granted ADMIN at startup (existing users) and at
# registration (new users). Empty by default — nobody is an admin until this is set.
admin:
  emails: ${ADMIN_EMAILS:}

# ── MinIO (S3-compatible storage) ────────────────────────────────────────────
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:secureleaf_minio_user}
  secret-key: ${MINIO_SECRET_KEY:secureleaf_minio_pass}
  bucket:
    raw-uploads: secureleaf-raw
    tiles: secureleaf-tiles
    thumbnails: secureleaf-thumbnails

# ── JWT ───────────────────────────────────────────────────────────────────────
jwt:
  secret: ${JWT_SECRET:CHANGE_ME_IN_PRODUCTION_USE_256BIT_SECRET_KEY}
  access-token-expiry-ms: 900000       # 15 minutes
  refresh-token-expiry-ms: 604800000   # 7 days

# ── Google OAuth2 ─────────────────────────────────────────────────────────────
google:
  oauth2:
    client-id: ${GOOGLE_CLIENT_ID:}   # Set via env var; leave empty to disable Google sign-in

# ── Commerce (Phase 4) ────────────────────────────────────────────────────────
commerce:
  platform-fee-bps: 1000         # 10% platform commission, in basis points (PAY-10, D7)
  currency: INR

# ── Payment gateway (Razorpay-shaped, D1) ─────────────────────────────────────
payment:
  gateway:
    provider: ${PAYMENT_GATEWAY:mock}   # mock | razorpay (not implemented yet — prod refuses to start)
    key-id: ${RAZORPAY_KEY_ID:rzp_test_mock_key}
    key-secret: ${RAZORPAY_KEY_SECRET:mock_key_secret_change_me}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:mock_webhook_secret_change_me}
  mock:
    webhooks-enabled: true            # mock gateway POSTs signed webhooks back to us
    duplicate-webhooks: true          # send every webhook twice — proves dedup (at-least-once delivery)
    webhook-delay-ms: 800
    timeout-webhook-delay-ms: 4000    # TIMEOUT scenario: browser gets 504, webhook arrives later (D13)

# ── Notifications (PAY-08) ────────────────────────────────────────────────────
notifications:
  email:
    enabled: ${NOTIFICATION_EMAIL_ENABLED:true}   # dev: caught by Mailpit at http://localhost:8025
    from: no-reply@secureleaf.local

# ── DRM / secure viewer (Phase 5) ─────────────────────────────────────────────
drm:
  signing-secret: ${DRM_SIGNING_SECRET:dev-only-change-me-32-bytes-minimum!!}   # HMAC key, TileUrlSigner (D5)
  signed-url-ttl-seconds: 30
  session:
    heartbeat-interval-seconds: 15   # D4 — client heartbeat cadence
    lease-seconds: 45                # D4 — Redis TTL a heartbeat refreshes; 3x the interval
  watermark:
    renderer: java2d             # Strategy: java2d | libvips (future)
    opacity: 0.25
    font-size: 24

# ── Async thread pool (content processing pipeline) ──────────────────────────
processing:
  thread-pool:
    core-size: 4
    max-size: 10
    queue-capacity: 100
    thread-name-prefix: "content-proc-"
  retry:
    max-attempts: 3

# ── Actuator ─────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

server:
  error:
    include-stacktrace: never
    include-message: always
