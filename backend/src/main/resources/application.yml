spring:
  application:
    name: secureleaf-backend

  # ── Database ─────────────────────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:secureleaf}
    username: ${DB_USER:secureleaf}
    password: ${DB_PASSWORD:secureleaf}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate          # Flyway manages schema; Hibernate validates only
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # ── Flyway migrations ────────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # ── Redis ─────────────────────────────────────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  # ── GraphQL ───────────────────────────────────────────────────────────────
  graphql:
    graphiql:
      enabled: true              # Disabled in production profile
    schema:
      locations: classpath:graphql/
      file-extensions: .graphqls

  # ── File Upload limits ───────────────────────────────────────────────────
  servlet:
    multipart:
      max-file-size: 55MB
      max-request-size: 60MB

  # ── Mail ──────────────────────────────────────────────────────────────────
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USER:}
    password: ${MAIL_PASS:}

# ── MinIO (S3-compatible storage) ────────────────────────────────────────────
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket:
    raw-uploads: secureleaf-raw
    tiles: secureleaf-tiles
    thumbnails: secureleaf-thumbnails

# ── JWT ───────────────────────────────────────────────────────────────────────
jwt:
  secret: ${JWT_SECRET:CHANGE_ME_IN_PRODUCTION_USE_256BIT_SECRET_KEY}
  access-token-expiry-ms: 900000       # 15 minutes
  refresh-token-expiry-ms: 604800000   # 7 days

# ── Signed URL TTL ────────────────────────────────────────────────────────────
drm:
  signed-url-ttl-seconds: 30
  watermark:
    renderer: java2d             # Strategy: java2d | libvips (future)
    opacity: 0.25
    font-size: 24

# ── Async thread pool (content processing pipeline) ──────────────────────────
processing:
  thread-pool:
    core-size: 4
    max-size: 10
    queue-capacity: 100
    thread-name-prefix: "content-proc-"
  retry:
    max-attempts: 3

# ── Actuator ─────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
