spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        generate_statistics: true
        # Quiets Hibernate's very verbose per-query statistics log line so the
        # N+1 assertion in MarketplaceQueryIT can read Statistics.getPrepareStatementCount()
        # directly instead of scraping stdout.
        session.events.log.LOG_QUERIES_SLOW_THRESHOLD_MILLIS: 999999999
