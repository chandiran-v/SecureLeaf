spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        generate_statistics: true
        # Quiets Hibernate's very verbose per-query statistics log line so the
        # N+1 assertion in MarketplaceQueryIT can read Statistics.getPrepareStatementCount()
        # directly instead of scraping stdout.
        session.events.log.LOG_QUERIES_SLOW_THRESHOLD_MILLIS: 999999999
        # Records SQL from HTTP request threads only, when a test switches it on (off otherwise).
        # Immune to background @Scheduled queries, unlike the global Statistics counter.
        session_factory.statement_inspector: com.secureleaf.support.RequestSqlRecorder


# Phase 4 — tests post signed webhooks themselves, deterministically, instead of relying on
# the mock gateway's timed background deliveries. No SMTP server in tests.
payment:
  mock:
    webhooks-enabled: false
  # Phase 09B D7 — the reconciliation timer would race with tests that stage PENDING orders;
  # PaymentReconciliationIT calls PaymentReconciliationJob.reconcile() directly instead.
  reconciliation:
    enabled: false
notifications:
  email:
    enabled: false

# Phase 5 — a 2s lease (vs. 45s in application.yml) lets ViewerIT prove EXPIRED behaviour with a
# short sleep instead of a 45s+ test. Session/tile-signing logic under test is identical either
# way; only the timer that would otherwise make the test slow changes.
drm:
  session:
    heartbeat-interval-seconds: 1
    lease-seconds: 2

# V8 — the link backfill timer would add background queries to query-count tests;
# PageLinkBackfillIT calls PageLinkService.backfill directly instead.
content:
  links:
    backfill:
      enabled: false

# Phase 10 — @SpringBootTest switches metric exporters off by default; the tile-metrics tests
# scrape /actuator/prometheus, so switch this one back on (an explicit per-exporter property
# beats the test default, and needs no @AutoConfigureObservability => no extra context).
management:
  prometheus:
    metrics:
      export:
        enabled: true

# Phase 13 — off by default so every older test sees exactly the Phase 12 pipeline (acceptance
# criterion 6). TileCacheIT and RedisTileCacheIT switch it on with @TestPropertySource.
tilecache:
  type: none
